<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر الشرح والخرائط الذهنية</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mindmap.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri&display=swap" rel="stylesheet">

    <!-- Mermaid (Optional, keeping if needed for old charts, but user wants replacement) -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>

    <!-- Marked (Markdown) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- MathJax -->
    <script>
    MathJax = {
      loader: {
        load: ['[tex]/arabic']
      },
      tex: {
        packages: {'[+]': ['arabic']},
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        tags: 'ams'
      },
      svg: {
        fontCache: 'global'
      }
    };
    </script>
    <!-- We need to manually load the arabic extension because it's not in the standard MathJax distribution -->
    <!-- However, MathJax 3 uses a different extension system. The library found (Edraak/arabic-mathjax) is for v2. -->
    <!-- Since mixing v2 extensions with v3 is tricky, and v3 has better RTL support natively,
         I will stick to MathJax 3 standard RTL but will try to use the v2 extension if I can shim it,
         OR mostly rely on manual RTL or just standard MathJax with RTL page context.

         Actually, let's switch to MathJax 2.7.x to use the proven Edraak library which does EXACTLY what the user requested (Arabic symbols).
         MathJax 3 is better generally, but the specific Arabic symbols (Flip, Arabic variable names) are best handled by that library.
    -->
    <script type="text/x-mathjax-config">
        MathJax.Hub.Config({
            extensions: ["tex2jax.js", "[arabic]/arabic.js"],
            jax: ["input/TeX", "output/HTML-CSS"],
            tex2jax: {
                inlineMath: [['$','$'], ['\\(','\\)']],
                displayMath: [['$$','$$'], ['\\[','\\]']],
                processEscapes: true
            },
            "HTML-CSS": {
                undefinedFamily: 'Amiri',
                linebreaks: { automatic: true }
            }
        });
        MathJax.Ajax.config.path["arabic"] = "https://cdn.jsdelivr.net/gh/Edraak/arabic-mathjax@master/dist";
    </script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-AMS_HTML-full"></script>

</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <h1>محرر المحتوى التعليمي</h1>
            <div class="toolbar">
                <button id="toggle-theme">🌙</button>
                <select id="font-size">
                    <option value="small">خط صغير</option>
                    <option value="medium" selected>خط متوسط</option>
                    <option value="large">خط كبير</option>
                </select>
                <button id="btn-help">؟ طريقة الاستخدام</button>
            </div>
        </header>

        <div class="main-content">
            <div class="editor-pane">
                <textarea id="editor" placeholder="اكتب هنا... (يدعم Markdown, LaTeX للمعادلات, و Mermaid للخرائط)"></textarea>
            </div>
            <div class="preview-pane" id="preview">
                <!-- Content will be rendered here -->
            </div>
        </div>
    </div>

    <!-- Modal for Help/Guide -->
    <div id="help-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="help-content"></div>
        </div>
    </div>

    <script src="js/mindmap.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
